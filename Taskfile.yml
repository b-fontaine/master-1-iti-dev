version: '3'

tasks:
  default:
    desc: Liste les tâches disponibles
    cmds:
      - task --list
    silent: true

  day-1:
    desc: Lance la séance 1 (diaporama + notes synchronisées)
    dir: cours/presentations
    cmds:
      - npm run day-1 -- {{.CLI_ARGS}}

  day-2:
    desc: Lance la séance 2 (diaporama + notes synchronisées)
    dir: cours/presentations
    cmds:
      - npm run day-2 -- {{.CLI_ARGS}}

  themes:
    desc: Lance la présentation des trois projets (diaporama + notes synchronisées)
    dir: cours/presentations
    cmds:
      - npm run themes -- {{.CLI_ARGS}}

  depots:test:
    desc: Teste le script de création des dépôts d'équipe (faux GitHub local, rien n'est créé en ligne)
    cmds:
      - bash cours/scripts/test-creer-depots.sh

  book:
    desc: Compile le support de cours (PDF et EPUB) dans support-de-cours/_book/
    cmds:
      - quarto render support-de-cours

  book:pdf:
    desc: Compile le support de cours en PDF seul
    cmds:
      - quarto render support-de-cours --to pdf

  book:epub:
    desc: Compile le support de cours en EPUB seul
    cmds:
      - quarto render support-de-cours --to epub

  book:test:
    desc: Teste le calcul de version du livre
    cmds:
      - bash support-de-cours/scripts/test-version-suivante.sh

  book:check:
    desc: Vérifie le support de cours (interdits, sources, rendu PDF et EPUB)
    cmds:
      - bash support-de-cours/scripts/verifier.sh
